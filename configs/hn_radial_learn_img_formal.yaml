# Fresh LEARN-IMG training on HN Radial pairs. Do not point this at pilot outputs.

# 不使用残差和脑mask的正式实验. 最开始的版本.
# 训练的一个样本: 某名受试者的一层多回波复数图像.
# 数据进入网络的形状为: [batch, 2, 4, height, width].

seed: 0 # 随机数种子便于重复实验.
deterministic: false # 未强制GPU运算使用确定性实现.
output_dir: results/hn-radial-learn-img-formal

model:
  in_channels: 2
  out_channels: 2     # 输入输出都是复数图像的实部和虚部.
  base_channels: 32   # 第一层的特征图数量.
  convs_per_level: 3  # U-Net卷积次数.
  num_levels: 4       # U-Net下采样再上采样的层级数.
  kernel_size: 3      # 卷积核大小: 3 x 3 x 3.
  output_relu: false  # 输出层不做ReLU截断, 因为复数图像的实虚部都可能为负.
  upconv_relu: true   # 上采样转置卷积后使用ReLU.
  residual: false     # false为直接映射: 网络直接预测无运动图像.

data:
  format: h5
  root: /data1/gcjiang3/generated/HNRepeatability_RadialMotion_v1
  slice_range: [112, 176] # Anatomical slices 113 through 176, inclusive.
  normalization: middle_slice_all_echoes # 用数据体中间层, 所有回波的平均幅度求缩放系数.
  shared_input_scale: true # 污染图像和无运动参考图像共用污染图像算出的缩放系数.
  use_brain_mask: false # 不使用脑掩膜.

loader:
  batch_size: 1 # 每次取一层.
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  drop_last: false

training:
  epochs: 150
  learning_rate: 1.0e-4
  bf16: false
  monitor: loss               # 以验证集损失最小来判断最佳模型.
  scheduler:
    factor: 0.5
    patience: 8
    min_lr: 1.0e-6
  early_stopping_patience: 25 # 连续25个epoch无改善就停止训练.

validation_preview:
  pair_id: sub-08_ses-01_m01_rl_step_moderate_seed10801
  slice_index: 140 # Anatomical slice 141.
  echo_index: 0
