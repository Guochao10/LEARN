[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-motion-pytorch"
version = "0.1.0"
description = "Modern PyTorch implementation of LEARN-IMG for multi-echo GRE motion correction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "h5py>=3.9",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "scipy>=1.10",
    "torch>=2.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
train = ["tensorboard>=2.14", "matplotlib>=3.8"]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
